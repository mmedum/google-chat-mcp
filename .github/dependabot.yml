version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
      include: scope

  # Python deps via uv's lockfile. The `uv` ecosystem preserves uv.lock
  # shape; `pip` would rewrite it into a form uv can't consume.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "ci"
      include: scope

  # Docker base images — the `FROM` lines in `Dockerfile`.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
      include: scope

  # Pinned hook revs in `.pre-commit-config.yaml`. Only the gitleaks repo is
  # pinned; the `local` hooks track the uv lockfile. ci.yml's gitleaks job
  # reads its version out of that same file, so one PR here moves both.
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
      include: scope
