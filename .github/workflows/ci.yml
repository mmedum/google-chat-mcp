name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Every `run` step in this file, on every platform. Without it a step on
# the Windows runner gets PowerShell, where the shell it was written for
# is bash — and the mangling shows up on the line that runs, not on the
# gate that reads it. Explicit `bash` also turns on `pipefail`, so a
# failure in the left half of a pipe stops the step.
defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The unit suite runs on every platform the release builds for. The
  # keyring and the config-directory paths differ per OS, and those are
  # exactly the parts a Linux-only run would not exercise.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # A build never pushes, so the token has no business staying
          # in .git/config where a later step could read it.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build ./...
      # The same -coverpkg the Makefile uses. It is written twice because
      # this job runs on three platforms and only one of them needs the
      # floor, and a test holds the two copies equal — they drifted once,
      # and the symptom was cmd/ reporting 0% here and 58% locally.
      - run: go test -race -coverpkg=./cmd/...,./internal/... -coverprofile=cov.out -covermode=atomic ./...
      - name: coverage floor
        if: matrix.os == 'ubuntu-latest'
        run: go run ./scripts/gates coverage cov.out

  # The tree scan cannot see an identifier that was committed and edited
  # out in a later commit, and gitleaks looks for credentials, which an
  # id is not. This walks the blobs the branch would add. It needs real
  # history, so it is its own job: the test matrix checks out shallow.
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - run: git fetch --no-tags origin main:refs/remotes/origin/main
      - run: LEAKCHECK_HISTORY=1 go test ./internal/leakcheck/ -run TestTheHistoryIsClean -v
      # The tree scan and the compiled-artifact rule, named so they show
      # up here rather than only inside `go test ./...`.
      - name: leaks
        run: go test ./internal/leakcheck -run 'TestTheRepositoryIsClean|TestNoBuildOutputInTheTree' -count=1

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # A build never pushes, so the token has no business staying
          # in .git/config where a later step could read it.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: out=$(gofmt -l .); [ -z "$out" ] || { echo "$out"; exit 1; }
      - run: go vet ./...
      # The eval suite is behind a build tag, so plain vet does not see
      # it — about 1,300 lines that would otherwise compile only on a
      # maintainer's machine. `make check` is what CI runs, and `make
      # vet` runs both, so this job has to as well.
      - run: go vet -tags=evals ./...
      - run: go vet -tags=live ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0
        with:
          version: v2.14.0
          # goinstall builds the pinned version with the Go from
          # go.mod, so the linter and the code it lints agree on the
          # language version. The prebuilt binary lags a new Go release.
          install-mode: goinstall
      - name: go mod tidy is up to date
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      # The release config is only ever exercised by a tag, and by then
      # the mistake is public. `check` catches a config-level one — an
      # unknown key, a build id nothing refers to — for the cost of a
      # pinned binary.
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de  # v7.3.0
        with:
          version: v2.18.1
          args: check

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # A build never pushes, so the token has no business staying
          # in .git/config where a later step could read it.
          persist-credentials: false
          # gitleaks scans history, so a shallow clone hides whatever a
          # branch introduced and later removed.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      # The Makefile holds each command and its version, so `make check`
      # runs exactly what this job runs.
      - name: govulncheck
        run: make vuln
      - name: licenses
        run: make licenses
      - name: gitleaks
        run: make gitleaks
      - name: actionlint
        run: make actionlint

  # A pull request that changes the tool surface names each changed item
  # in a commit footer. It measures from the merge-base, which only a
  # pull request has, so it is not in `make check`.
  pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PR_BASE_REF: origin/${{ github.base_ref }}
      # The head commit, not the merge commit the checkout sits on.
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - name: schema change acknowledged
        run: go run ./scripts/gates schema-ack "$PR_BASE_REF" "$PR_HEAD"

  # The gates that need a built binary: it has to speak MCP over stdio
  # without credentials, keep its tool surface, and match the docs.
  binary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # A build never pushes, so the token has no business staying
          # in .git/config where a later step could read it.
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      # Built as `make build` builds it, which is how schema-ack builds
      # both sides too.
      - run: CGO_ENABLED=0 go build -trimpath -o google-chat-mcp ./cmd/google-chat-mcp
      - name: every third-party tool is pinned
        run: go run ./scripts/gates pins
      - name: make check and CI run the same gates
        run: go run ./scripts/gates parity
      - name: the error vocabulary is closed
        run: go run ./scripts/gates classes
      - name: the drivers redact their transcript
        run: go run ./scripts/gates transcript
      - name: every API method is used or left out on purpose
        run: go run ./scripts/gates api-coverage
      - name: every published field is modeled or left out on purpose
        run: go run ./scripts/gates api-fields
      - name: every decision, citation and named path resolves
        run: go run ./scripts/gates docs
      - name: stdio smoke
        run: go run ./scripts/gates smoke ./google-chat-mcp
      - name: schema diff against the released baseline
        run: go run ./scripts/gates schema-diff ./google-chat-mcp
      # The live driver cannot run here — it needs a login and writes to
      # a real account — but its surface gate can: it reads what the
      # built binary registers, which needs no credentials. So can the
      # driver's own unit tests, which answer its calls with a fake.
      - name: every tool and option is exercised, and the driver's cleanup holds
        run: >
          go test -tags=live ./internal/livecheck -count=1
          -skip '^TestLive$'
      - name: docs match the code
        run: go run ./scripts/gates staleness ./google-chat-mcp
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: schemas
          path: schemas.json
