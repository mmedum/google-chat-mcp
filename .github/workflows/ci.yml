name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # dorny/paths-filter calls the GitHub API on pull_request events to enumerate
  # changed files; requires PR-metadata read access in addition to contents.
  pull-requests: read

env:
  # One place for the uv CI runs on. Dependabot's `github-actions` ecosystem
  # bumps the `uses:` SHA but never a `with:` input, so a per-job literal here
  # is a pin nothing watches. Keep it in step with the Dockerfile's
  # `ghcr.io/astral-sh/uv` tag: CI resolves the lockfile the image is built
  # from, and a split between them is only ever discovered the hard way.
  UV_VERSION: "0.12.3"
  # Same reasoning as UV_VERSION: no Dependabot ecosystem reads a `with:`
  # input. release.yml scans the published image and pins this separately —
  # workflows can't share an `env:` block, so keep the two in step.
  TRIVY_VERSION: "v0.73.0"

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: filter
        with:
          # Positive allowlist: `code == 'true'` if any changed file is on the
          # project's build/test surface. Pure docs PRs (only .md or docs/**)
          # leave `code == 'false'` and skip the expensive jobs below.
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'Dockerfile'
              - '.dockerignore'
              - '.hadolint.yaml'
              - '.pre-commit-config.yaml'
              - '.github/workflows/**'
              - '.python-version'

  lint-and-type:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Sync
        run: uv sync --frozen --extra dev
      - name: Ruff (lint)
        run: uv run ruff check .
      - name: Ruff (format)
        run: uv run ruff format --check .
      - name: ty (type check)
        run: uv run ty check
      - name: Lint workflows
        # rhysd/actionlint is the upstream-author-published image — identical
        # binary to the GitHub release. Switched from raven-actions/actionlint
        # because that wrapper pulls actions/github-script whose bundled
        # @actions/tool-cache fails under Node 20's export-map enforcement
        # (ERR_PACKAGE_PATH_NOT_EXPORTED on CI).
        run: docker run --rm -v "$PWD":/repo -w /repo rhysd/actionlint:1.7.12 -color
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387  # v3.5.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml
      - name: Published image tag matches the current release
        # compose.yml is what the README tells deployers to run, and its
        # `image:` tag is a version nothing watches — it sat on 0.2 through
        # five minor releases while `release.yml` was publishing 1.4. Anchor
        # it to the newest CHANGELOG heading, which the release commit updates
        # first, so a forgotten bump fails here instead of shipping a stale
        # quickstart.
        run: |
          set -euo pipefail
          want=$(sed -n 's/^## \[\([0-9]\+\.[0-9]\+\)\.[0-9]\+\].*/\1/p' CHANGELOG.md | head -1)
          got=$(sed -n 's|^[[:space:]]*image:[[:space:]]*ghcr\.io/.*/google-chat-mcp:\(.*\)$|\1|p' compose.yml | head -1)
          echo "CHANGELOG major.minor: ${want}   compose.yml tag: ${got}"
          if [ -z "$want" ] || [ -z "$got" ]; then
            echo "::error::Could not parse the release version or the compose image tag"
            exit 1
          fi
          if [ "$want" != "$got" ]; then
            echo "::error::compose.yml pins :${got} but the current release is ${want}." \
                 "Update the image tag in compose.yml and README.md."
            exit 1
          fi

  test:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Exercise every minor in `requires-python` (>=3.12,<3.15). Dev
        # default + shipped Docker image stay on 3.14 (.python-version);
        # the other rows let uv resolve fresh against each interpreter so
        # regressions on `uv tool install` targeting 3.12 / 3.13 surface here.
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      # `uv sync --extra dev` (no --frozen) here — `uv.lock` is resolved
      # against the `.python-version` interpreter (3.14) and won't satisfy
      # `--frozen` on a 3.12 or 3.13 row. lint-and-type stays `--frozen`
      # (single-version, lockfile correctness gate).
      - name: Sync
        run: uv sync --extra dev
      - name: Pytest
        run: uv run pytest --cov-fail-under=80

  audit:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Sync
        run: uv sync --frozen --extra dev
      # Audit the exported lockfile rather than the environment so pip-audit
      # doesn't try (and fail) to resolve `google-chat-mcp` itself on PyPI.
      # `--no-emit-project` drops the self-package from the export.
      # CVE-2025-69872 (diskcache pickle) has no upstream fix at any version.
      # Assessed and accepted under "Accepted advisories" in docs/security.md;
      # revisit there on an upstream release.
      - name: pip-audit
        run: |
          uv export --format requirements-txt --no-emit-project --no-hashes -q \
            | uv run pip-audit --strict -r /dev/stdin --ignore-vuln CVE-2025-69872

  container:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          tags: google-chat-mcp:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # The runtime stage's `apt-get upgrade` is what keeps the image on
          # current Debian security fixes, but nothing in that layer's hash
          # changes when Debian publishes one, so a warm cache replays a
          # stale package set and the upgrade silently becomes a no-op.
          # Only a base-tag rebuild invalidates it, and Docker Hub rebuilds
          # `python:3.14-slim` well after the fix lands in trixie-security —
          # a window in which the image ships known-vulnerable packages and
          # the Trivy step below goes red for something no rebase can fix.
          # (Four util-linux CVEs did exactly this in Aug 2026.) Rebuild the
          # stage every time; the builder stage, which is the slow one,
          # keeps its cache.
          no-cache-filters: runtime
      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          # Pinned via the workflow `env:` block above, which release.yml
          # mirrors. The action's bundled build nags about newer releases in
          # scan output; this only moves when someone looks.
          version: ${{ env.TRIVY_VERSION }}
          image-ref: google-chat-mcp:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history is needed so a PR scan can resolve origin/<base>
          # and a push scan can resolve the ${before}..${after} range.
          fetch-depth: 0
      - name: Install gitleaks
        # Direct install with a pinned tag; avoids the third-party
        # gitleaks-action wrapper and its GITHUB_TOKEN / comment-posting surface.
        #
        # The tag is read out of `.pre-commit-config.yaml` rather than written
        # here. This job is the merge gate (the hook is opt-in — CONTRIBUTING
        # says so, and `--no-verify` skips it), and a version baked into a
        # `run:` step is invisible to every Dependabot ecosystem. Written twice,
        # only the hook copy got bumped and the gate silently kept scanning
        # v8.21.2 rules. One source of truth, one PR moves both.
        run: |
          set -euo pipefail
          rev=$(sed -n 's/^[[:space:]]*rev:[[:space:]]*\(v[0-9][^[:space:]]*\).*/\1/p' \
            .pre-commit-config.yaml | head -1)
          if [ -z "$rev" ]; then
            echo "::error::Could not read the gitleaks rev from .pre-commit-config.yaml"
            exit 1
          fi
          echo "gitleaks rev from .pre-commit-config.yaml: ${rev}"
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/${rev}/gitleaks_${rev#v}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan
        # Diff-scope scanning: PRs scan only commits the branch adds vs the
        # base; pushes scan only the pushed range. Both are O(commits-in-PR)
        # rather than O(repo-history), keeping the job comfortably under the
        # 5-min timeout even as history grows. Any leak already in merged
        # history will have been flagged on its original PR.
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          case "$EVENT" in
            pull_request)
              RANGE="origin/${BASE_REF}..HEAD"
              ;;
            push)
              # A brand-new branch push has before=000...; fall through to
              # a working-tree-only scan so the job doesn't attempt to
              # resolve a non-existent range.
              if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
                RANGE=""
              else
                RANGE="${BEFORE}..${AFTER}"
              fi
              ;;
            *)
              RANGE=""
              ;;
          esac
          if [ -n "$RANGE" ]; then
            echo "Scanning commit range: $RANGE"
            gitleaks detect --source . --redact --exit-code 1 --log-opts="$RANGE"
          else
            echo "No commit range (new branch or manual dispatch) — scanning working tree only"
            gitleaks detect --source . --redact --exit-code 1 --no-git
          fi
