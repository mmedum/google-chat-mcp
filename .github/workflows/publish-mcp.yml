# Publishes this server's entry to the MCP registry.
#
# It is its own workflow, callable two ways, because the registry sends a
# HEAD to the bundle's download URL before it accepts an entry — so this
# can only run AFTER the release exists, and a step that can only run
# last is a step that needs a way to be run again on its own. As a job
# welded into release.yml it had no such way: re-running that workflow
# re-runs goreleaser against a release that already exists, and an entry
# for a tag that shipped weeks ago could not be published at all.
#
# It is also its own job for privilege. mcp-publisher is a third-party
# binary handed a token that can publish under io.github.mmedum, and the
# release job holds contents: write and attestations: write — so running
# the publisher there gave it the ability to rewrite the release it had
# just been told about. Verifying the binary is what makes running it
# acceptable; least privilege is what stops that being the only thing in
# the way.
#
# Both paths read the PUBLISHED release's checksums.txt rather than a
# local build, so the hash a client verifies is the number cosign signed,
# and the two paths cannot diverge because there is only one of them.
name: Publish to the MCP registry

on:
  workflow_call:
    inputs:
      tag:
        description: The release tag whose bundle the entry points at.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag whose bundle the entry points at, such as v2.1.0.
        required: true
        type: string

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # The registry proves the io.github.mmedum namespace from this
      # token, and that is the only thing this job may do.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # cosign is here to VERIFY, not to sign: this job signs nothing.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Take the checksums from the published release
        run: |
          set -euo pipefail
          gh release download "${TAG}" --pattern 'checksums.txt*' --dir dist
          ls dist
        env:
          TAG: ${{ inputs.tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The entry's fileSha256 is lifted out of this file, and that is
      # the number a registry-driven client checks its download against.
      # Reading it unverified leaves that claim resting on nothing: an
      # attacker who can replace a release asset can edit checksums.txt
      # beside it, and this job would copy their digest into a registry
      # whose entries cannot be withdrawn — including through the
      # dispatch path, which exists to re-publish for a tag that shipped
      # weeks ago, long after anybody was watching.
      #
      # The signature is the detection the rest of the pipeline exists
      # for, and this is where it has to be consulted. The identity
      # carries the exact tag rather than a regexp: a signature from some
      # other workflow, or for some other tag, is not this release.
      - name: Verify the signature over them before reading them
        run: |
          set -euo pipefail
          cosign verify-blob dist/checksums.txt \
            --bundle dist/checksums.txt.bundle \
            --certificate-identity \
              "https://github.com/${REPO}/.github/workflows/release.yml@refs/tags/${TAG}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
        env:
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}

      - name: Write the entry, and show it before anybody sees it
        run: |
          go run ./scripts/gates server-json "${TAG}" dist/checksums.txt > server.json
          cat server.json
        env:
          TAG: ${{ inputs.tag }}

      - name: Publish it
        run: |
          set -euo pipefail
          asset=mcp-publisher_linux_amd64.tar.gz
          curl -fsSL -O "${BASE}/${PUBLISHER_VERSION}/${asset}"
          curl -fsSL -O "${BASE}/${PUBLISHER_VERSION}/${asset}.sigstore.json"
          # A version pins WHICH artifact to fetch; it does not say the
          # bytes are the ones upstream built. A tag is mutable and a
          # release asset can be replaced, and this binary is then handed
          # a token that can publish under this namespace — so it is
          # verified before it is unpacked, which is also why the
          # download is a file rather than a pipe into tar: a stream that
          # has already been extracted cannot be checked.
          #
          # The identity carries the exact tag. Bumping PUBLISHER_VERSION
          # without bumping it here fails loudly, where a regexp would
          # quietly accept whatever that tag now points at.
          cosign verify-blob "${asset}" \
            --bundle "${asset}.sigstore.json" \
            --certificate-identity \
              "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${PUBLISHER_VERSION}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          tar xzf "${asset}" mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish server.json
        env:
          # Pinned, like everything else that decides what a release is.
          PUBLISHER_VERSION: v1.8.1
          BASE: https://github.com/modelcontextprotocol/registry/releases/download
