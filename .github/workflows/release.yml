name: release

on:
  push:
    tags: ['v*.*.*']
  # Pushing more than three tags at once makes GitHub drop the tag
  # events, and a release can fail for reasons that have nothing to do
  # with the tag, so it can also be started by hand — run it against the
  # tag, not a branch, since the checkout, the notes and goreleaser all
  # read the same ref.
  workflow_dispatch:

# Read by default; the one job that publishes raises what it needs.
permissions:
  contents: read

# Every `run` step in this file, on every platform. Without it a step on
# the Windows runner gets PowerShell, where the shell it was written for
# is bash — and the mangling shows up on the line that runs, not on the
# gate that reads it. Explicit `bash` also turns on `pipefail`, so a
# failure in the left half of a pipe stops the step.
defaults:
  run:
    shell: bash

jobs:
  # A tag is just a pointer — nothing stops one landing on a commit
  # whose CI never ran or ran red. Everything below publishes somewhere
  # irreversible, so require a green `ci` run for this exact commit
  # first. The lockfile once sat stale for months with CI red and nobody
  # noticed; the same blind spot on the release path ships the artifact.
  verify-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require a successful ci run for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          conclusion=$(gh api \
            "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${SHA}&status=completed" \
            --jq '[.workflow_runs[] | select(.conclusion != null)][0].conclusion // "none"')
          echo "ci conclusion for ${SHA}: ${conclusion}"
          if [ "${conclusion}" != "success" ]; then
            echo "::error::Refusing to release ${SHA}: ci is '${conclusion}', not 'success'." \
                 "Push the tag only after ci passes on this commit."
            exit 1
          fi

  goreleaser:
    needs: verify-ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      # Keyless signing and build provenance both prove who built the
      # artifacts, and both need an OIDC token to do it.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # goreleaser reads tags, and a shallow clone has none.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod

      # ci already ran this on three platforms for this commit. Running
      # it again here costs a minute and closes the gap between "ci was
      # green" and "these are the bytes being signed".
      - run: go test ./...

      # The CHANGELOG entry is the release note. Notes generated from
      # commit subjects would tell someone deciding whether to upgrade
      # about our commit hygiene instead.
      # Written outside the checkout on purpose. goreleaser refuses to
      # release from a dirty tree, and an untracked file in the working
      # directory is dirty — `release --clean` deletes dist/ and has
      # nothing to say about anything else. This is invisible in a
      # rehearsal, because `--snapshot` does not run that check at all,
      # so the first tag is the first time it can fail. It did.
      - name: Release notes from the CHANGELOG
        env:
          REF_NAME: ${{ github.ref_name }}
        run: bash scripts/extract-release-notes.sh "${REF_NAME}" > "${RUNNER_TEMP}/release-notes.md"

      # Pinning an action does not pin what the action installs. Both of
      # these fetch a tool, and without a version they fetch whatever is
      # current that morning — a half-pinned step that reads exactly like
      # a pinned one, and a green build that cannot be reproduced
      # tomorrow.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2
        with:
          syft-version: v1.51.1

      # goreleaser packs the Claude Desktop bundle in a build hook, which
      # shells out to npx. The runner image ships a Node that changes
      # without notice, so the version is pinned here like everything
      # else — exactly, not to a major line; the mcpb CLI version is
      # pinned in the pack script.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24.20.0

      # Same rule as the two steps above: the action is pinned, so the
      # goreleaser it runs is pinned too. "~> v2" would float within the
      # major version.
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94  # v7.2.3
        with:
          version: v2.18.1
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Provenance ties every published archive to this workflow, this
      # commit and this runner, checkable from outside with
      # `gh attestation verify`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: "dist/*.tar.gz,dist/*.zip,dist/*.mcpb,dist/checksums.txt"

      # The MCP registry entry. It comes last because the registry does a
      # HEAD on the bundle's download URL before it accepts the entry, so
      # the release has to exist first. A tag pushed while
      # `release.disable` is still set in .goreleaser.yaml publishes
      # nothing and fails here, which is the right way round: an entry
      # pointing at a release nobody can download is worse than no entry.
      #
      # The hash comes from the release's own checksums.txt. Clients
      # check the bundle against it before they install, and the registry
      # requires it for an MCPB package — which is why this is not
      # goreleaser's `mcp` block, whose package entry has nowhere to put
      # a hash.
      # A prerelease tag rehearses the pipeline; it must not rehearse the
      # registry. The registry takes a prerelease version happily and an
      # entry cannot be taken back, so `v1.0.0-rc1` would leave a
      # permanent row pointing at a bundle nobody should install. Same
      # rule goreleaser's `prerelease: auto` uses: a hyphen in the tag.
      - name: Registry entry from the release's own checksums
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          go run ./scripts/gates server-json "${REF_NAME}" dist/checksums.txt > dist/server.json
          cat dist/server.json

      # Same rule as cosign and syft above: pinned, and verified before
      # it runs. This job holds an identity that can publish under
      # io.github.mmedum, so an unverified binary here would be handed
      # exactly that.
      - name: Install mcp-publisher
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          PUBLISHER: v1.8.1
          BASE: https://github.com/modelcontextprotocol/registry/releases/download
        run: |
          set -euo pipefail
          asset=mcp-publisher_linux_amd64.tar.gz
          curl -fsSL -O "${BASE}/${PUBLISHER}/${asset}"
          curl -fsSL -O "${BASE}/${PUBLISHER}/${asset}.sigstore.json"
          cosign verify-blob "${asset}" \
            --bundle "${asset}.sigstore.json" \
            --certificate-identity \
              "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${PUBLISHER}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          tar xzf "${asset}" mcp-publisher

      - name: Publish to the MCP registry
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          set -euo pipefail
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish dist/server.json
