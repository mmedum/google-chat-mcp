version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocyclo
    - misspell
    - unparam
    - gocritic
    - revive
    - bodyclose
    - errorlint
    - nilerr
    - prealloc
    - makezero
  settings:
    gocyclo:
      min-complexity: 25
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    revive:
      rules:
        - name: var-naming
        - name: exported
          arguments: ["disableStutteringCheck"]
        - name: unused-parameter
        - name: empty-block
        - name: unreachable-code
  exclusions:
    rules:
      - path: _test\.go
        linters: [gocyclo, unparam, errcheck, bodyclose, revive, prealloc]

formatters:
  enable:
    - gofmt
