version: "2"

run:
  timeout: 5m
  # Without these the linter does not see internal/livecheck or
  # internal/evals at all — every file in both is behind a build tag, so
  # they are simply absent from the package and all fifteen linters
  # report nothing about 2,300 lines. `go vet` is already run under both
  # tags for the same reason (Makefile, ci.yml). Both can be on at once
  # because no file here uses a negated constraint.
  build-tags: [live, evals]

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocyclo
    - misspell
    - unparam
    - gocritic
    - revive
    - bodyclose
    - errorlint
    - nilerr
    - prealloc
    - makezero
    - forbidigo
  settings:
    forbidigo:
      # The MCP spec's stdio transport is normative: the server MUST NOT
      # write anything to stdout that is not a valid MCP message, and MAY
      # log to stderr. A stray print corrupts the JSON-RPC stream and the
      # client silently stops working, so the process's streams are named
      # in exactly one place and forbidden everywhere else.
      analyze-types: true
      forbid:
        - pattern: ^fmt\.Print.*$
          msg: stdout carries only MCP JSON-RPC frames; write through the boundary helpers
        - pattern: ^os\.Stdout$
          msg: stdout carries only MCP JSON-RPC frames; take an io.Writer instead
    gocyclo:
      min-complexity: 25
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    revive:
      rules:
        - name: var-naming
        - name: exported
          arguments: ["disableStutteringCheck"]
        - name: unused-parameter
        - name: empty-block
        - name: unreachable-code
  exclusions:
    rules:
      # scripts/ is maintainer tooling run at a terminal, not the server.
      - path: ^scripts/
        linters: [forbidigo]
      - path: _test\.go
        linters: [gocyclo, unparam, errcheck, bodyclose, revive, prealloc]

formatters:
  enable:
    - gofmt
